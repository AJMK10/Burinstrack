services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=burintrack_dev
      - POSTGRES_USER=burintrack
      - POSTGRES_PASSWORD=devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
