  <text x="126" y="346" text-anchor="middle" font-size="8" font-family="Arial Black,sans-serif" font-weight="900" fill="rgba(255,255,255,0.35)" letter-spacing="1.5">BURINFORT</text>

  <!-- ===== TOP SCANNER ===== -->
  <rect x="57" y="90" width="388" height="78" rx="10" fill="rgba(255,255,255,0.14)"/>
