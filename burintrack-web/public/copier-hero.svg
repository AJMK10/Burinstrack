  <line x1="329" y1="341" x2="329" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="338" y1="341" x2="338" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="347" y1="341" x2="347" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="356" y1="341" x2="356" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="365" y1="341" x2="365" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="374" y1="341" x2="374" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="383" y1="341" x2="383" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="392" y1="341" x2="392" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="401" y1="341" x2="401" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="410" y1="341" x2="410" y2="365" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

