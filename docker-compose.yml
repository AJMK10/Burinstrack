services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - web_static:/var/www/html:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/BurinTrack.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db.dqvrfoaseimnlhgemslf.supabase.co;Port=5432;Database=postgres;Username=postgres;Password=${SUPABASE_DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=burintrack-api
      - Jwt__Audience=burintrack-web
      - Email__De=${EMAIL_FROM}
      - Email__Smtp=${SMTP_HOST}
      - Email__Port=${SMTP_PORT}
      - Email__Utilisateur=${SMTP_USER}
      - Email__MotDePasse=${SMTP_PASSWORD}
      - AllowedOrigins=${APP_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./burintrack-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${APP_URL}/api
    volumes:
      - web_static:/app/dist:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  web_static:
