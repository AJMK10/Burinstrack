services:
  db:
    image: postgres:16-alpine
    container_name: burintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: burintrack
      POSTGRES_USER: burintrack
      POSTGRES_PASSWORD: burintrack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burintrack-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "10000:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:10000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=burintrack;Username=burintrack;Password=burintrack_dev"
      Jwt__Secret: "ln9u/tpY8o+vAV/Yzu+6hIK1k8H3FOY2W/f1nN4LMVfC/PyzgPz4edXzhmfThZM4H1EGE4kdH/ZTFZlW36dkyA=="
      Jwt__Issuer: burintrack-api
      Jwt__Audience: burintrack-web
      AllowedOrigins: http://localhost:5173
      ADMIN_INITIAL_PASSWORD: "BurinTrack@2026!"

volumes:
  pgdata:
