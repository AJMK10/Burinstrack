services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - web_static:/var/www/html:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/BurinTrack.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db.dqvrfoaseimnlhgemslf.supabase.co;Port=5432;Database=postgres;Username=postgres;Password=${SUPABASE_DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=burintrack-api
      - Jwt__Audience=burintrack-web
      - Email__De=${EMAIL_FROM}
      - Email__Smtp=${SMTP_HOST}
      - Email__Port=${SMTP_PORT}
      - Email__Utilisateur=${SMTP_USER}
      - Email__MotDePasse=${SMTP_PASSWORD}
      - AllowedOrigins=${APP_URL}
      - MinIO__Endpoint=localstack:4566
      - MinIO__AccessKey=${MINIO_USER}
      - MinIO__SecretKey=${MINIO_PASSWORD}
      - MinIO__BucketName=burintrack
      - MinIO__Secure=false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./burintrack-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${APP_URL}/api
    volumes:
      - web_static:/app/dist:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=${MINIO_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
    volumes:
      - localstack_data:/var/lib/localstack
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  localstack_data:
  web_static:
